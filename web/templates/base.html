{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}Megaron{{end}}</title>
  <link rel="stylesheet" href="/static/megaron.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap">
  <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>
  <script defer src="https://s.kristall.info/script.js" data-website-id="6678e851-1e9b-4527-896d-f46ae55cde77"></script>
  <script>
    document.addEventListener('htmx:configRequest', function(e) {
      const token = localStorage.getItem('poleia_token');
      if (token) e.detail.headers['Authorization'] = 'Bearer ' + token;
    });
  </script>
</head>
<body{{if .MapMode}} class="map-mode"{{end}}>
  {{if not .MapMode}}
  <nav class="topbar">
    <a href="/" class="logo">ΜΕΓΑΡΟΝ</a>
    <div class="nav-links">
      {{block "nav" .}}{{end}}
    </div>
  </nav>
  {{end}}
  <main>
    {{block "content" .}}{{end}}
  </main>
  {{if not .MapMode}}
  <footer>
    <span>Megaron — Bronze Age strategy</span>
  </footer>
  {{end}}
</body>
</html>{{end}}
