<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Megaron — forest showcase</title>
<!--
  Offline visuell rigg för terrängarbete (skogen först). Ingen server, ingen
  auth, ingen fetch: sidan fyller State med en fast 9x9-fixtur och ritar EN
  fryst frame ur den riktiga renderaren (render/map.js), så det som syns här
  är exakt vad spelaren ser — inte en parallell ritkod.

  Frysningen: requestAnimationFrame stubbas i skriptet nedan, FÖRE modulen
  importeras, så render() aldrig schemalägger sig själv. Havsshimret och
  gånganimationen är frame-beroende (State.animFrame), och en fast frame gör
  därför skärmdumpen pixeldeterministisk — annars blir varje diff brus.

  Kör:  python3 -m http.server 8099 --directory web/
        http://localhost:8099/static/showcase-forest.html
        ?fixture=        plains | relief | dry | river | cedar — byter vilken terräng som
                         dominerar (samma renderare, samma kamera). Terrängen
                         under arbete ska dominera bilden.
        ?world=<sträng>  byter världshash utan att röra fixturen.
  Dump: scratchpad/shot.py <etikett> [query]
-->
<link rel="stylesheet" href="/static/megaron.css">
<style>
  body { margin: 0; background: #14100C; }
  #map-root { position: relative; width: 900px; height: 780px; }
  #hex-canvas { display: block; width: 100%; height: 100%; }
  #tile-tooltip { position: absolute; display: none; }
</style>
<script>
  // Måste ligga i ett vanligt (icke-module) skript: modulimporter körs efter
  // att all synkron parse-tid-kod gjort sitt, så stubben hinner före map.js.
  window.requestAnimationFrame = function () { return 0; };
</script>
</head>
<body>
<div id="map-root">
  <canvas id="hex-canvas"></canvas>
  <div id="tile-tooltip"></div>
</div>

<script type="module">
import { State } from '/static/js/megaron/state.js';
import { render, canvas, SCALE, hexPx } from '/static/js/megaron/render/map.js';

// ── Fixtur ────────────────────────────────────────────────────────────────
// Nio rader à nio kolumner. Raden är skärmrad; axial r härleds som
// r = row - floor(q/2) så blocket blir rektangulärt på skärmen i stället för
// en romb. Tecken:
//   ~ deep_sea   c coastal_sea   p plains   F forest_olive_grove
//   h hills      m mountain_limestone       M mountain_red
//   s scrub_maquis            d semi_desert            . fog
//   r river      v river_valley   D river_delta   C forest_cedar
//
// Sex fixturer, valda med ?fixture=. Terrängen under arbete måste dominera
// bilden — en remsa på tre hexar räcker inte för att bedöma om ett fält läser
// som massa, och massa är hela frågan (megaron_terrangrendering princip 1–4).
// Övriga terränger finns kvar som grannar, för det är i mötet en ändring
// läcker: mot kust, mot kulle, mot fog, under stad, väg, fyndighet och enhet.
const FIXTURES = {
  // Skogen dominerar. Slätten är remsan i väster.
  forest: [
    '~~cppFFhh',
    '~cppFFFhm',
    '~cpFFFFFh',
    'cpFFFFFFh',
    'cpFFFFFFp',
    'cpFFFFFpp',
    '~cpFFFpp.',
    '~~cppFp..',
    '~~~cpp...',
  ],
  // Slätten dominerar. Grannarna är valda efter vad slätten kan KOLLIDERA med,
  // inte efter vad som är vackert: lunden (`#9EA361`) i öster för att slättens
  // ton måste gå att skilja från den bleka olivkhakin, och skrub (`#A8B860`) +
  // halvöken (`#D4B878`) för att de ligger i exakt det pale-varma register en
  // medelhavsslätt vill flytta in i. Utan dem i bilden går kollisionen inte att
  // se, och en osynlig kollision är den enda sortens fel riggen inte fångar.
  plains: [
    '~~cppppsh',
    '~cpppppsm',
    'cppppppsh',
    'cpppppFph',
    'cppppFFph',
    'cppppppdh',
    '~cpppppd.',
    '~~cppppp.',
    '~~~cppp..',
  ],
  // Höjdfamiljen dominerar: ett sammanhängande kalkstensmassiv (m) med en röd
  // rygg (M) i, kullar (h) som skirtar det — vilket också är den sanna
  // geografin: kullar ligger mellan slätt och berg, inte var som helst.
  //
  // Grannarna är valda ur den UPPMÄTTA valörkollisionen, inte ur smak
  // (princip 17). I luminans ligger idag `hills` 167,5 och `scrub_maquis`
  // 169,2 — 1,7 isär, alltså samma yta i gråskala; `mountain_red` 156,4 ligger
  // 2,4 från olivlunden och 11,1 från kullarna. Därför MÅSTE scrub, halvöken
  // och lund stå i samma bild som de tre höjdterrängerna, annars är
  // kollisionen osynlig och riggen bevisar ingenting.
  //
  // Massivet rör kustvattnet i nordväst med flit: berg mot hav är klippkust,
  // det möte där en bergskant har mest att bevisa (kontrastbudgeten, princip 6,
  // reserverar sina ytterligheter åt just kustlinje och bergskant). Sedan
  // 2026-07-27 ligger DESSUTOM en röd bergshex direkt mot kustvattnet i väster:
  // `mountain_red` mätte 0,7 L från `coastal_sea` i medelvärde, och den frågan
  // ska avgöras av ett gråskalesnitt genom den faktiska gränsen — inte av två
  // medelvärden, eftersom det är skreens ton och inte hexens medel som möter
  // vattnet vid kanten.
  relief: [
    '~cmmmmmhh',
    'cpmmmMMhh',
    'cpshmMMhh',
    'cphhmmhhs',
    'cphhhhhhd',
    'cpFhhhmmd',
    '~cMhhhmm.',
    '~cpshhMh.',
    '~~cpshh..',
  ],
  // Torrmarken dominerar: skruben (s) i väster, halvöknen (d) i öster, med
  // gränsen mellan dem tvärs bilden. De två är EN slice och måste därför stå
  // i samma bild — de delar rot (isolerade märken, gammal seed) och måste
  // dessutom gå att skilja från VARANDRA, inte bara från grannarna.
  //
  // Kullarna (h) ligger mot båda med flit och är inte dekor: den lagade
  // mätaren (`6abd87b`) hittade `hills ↔ semi_desert` 3,9 och `hills ↔ scrub`
  // 7,9 i MARKTON — kartans två närmaste landpar. Ligger de inte i samma bild
  // är slicens svåraste fråga osynlig. Slätten (p) och lunden (F) står med som
  // tonankare i andra änden av registret (princip 7: torr guldmark är LJUSARE
  // än bördig grön, och skruben ligger mellan dem).
  dry: [
    '~cpsssshh',
    '~cpsssshd',
    'cpsssssdd',
    'cpFsssddd',
    'cpsssssdd',
    'cpsssshdd',
    '~cpssshd.',
    '~~cpsshd.',
    '~~~cpsdd.',
  ],
  // Flodfamiljen: floden (r) som EN sammanhängande kedja från källan i öster
  // till mynningen i havet i väster, dalen (v) på var sida hela vägen, deltat
  // (D) vid utflödet. Kedjan slingrar med flit — en rak flod visar bara ett
  // hexläge, och hela frågan är om bågen håller ihop över hexkanten i rakt
  // genomlopp, i krök, vid källan och vid mynningen.
  //
  // Grannarna är valda ur kollisionsrisken, inte ur skönhet. Tre par måste stå
  // i samma bild: `river ↔ river_valley` (delar VARJE kant per konstruktion —
  // kartans hårdaste par), `river ↔ coastal_sea` (mynningen, där två vatten
  // möts) och `river_valley ↔ plains` (dalen får inte bli en grön slätt).
  // Kullar och berg står i öster som källans höjd — samma geografi mapgen
  // faktiskt lägger: floden börjar på en lokal höjdpunkt.
  river: [
    '~~pvvpphm',
    '~cppvvphm',
    '~ccvvvvhm',
    'cDvvvvvhm',
    'crrrrrvhm',
    'cDvvvrrrv',
    '~ccvvvvvh',
    '~~ccppphh',
    '~~~cppphh',
  ],
  // Cederskogen dominerar, och olivlunden (F) ligger som ett obrutet band mot
  // den. Det bandet ÄR fixturens fråga: två skogar bredvid varandra måste läsa
  // som två olika sorters skog, inte som ljus och mörk variant av samma. Faller
  // det paret spelar ingen annan mätning roll. Slätt och kullar står med som
  // tonankare i ljusa änden, kustvattnet i mörka — cedern är kartans mörkaste
  // LANDterräng och måste gå att skilja från vatten.
  cedar: [
    '~~pFFCChh',
    '~cpFCCChh',
    'cpFCCCCCh',
    'cpFCCCCCh',
    'cpCCCCCCh',
    'cpFCCCCCp',
    '~cpFCCCpp',
    '~~cpFCCp.',
    '~~~cpFC..',
  ],
};

const FIXTURE = new URLSearchParams(location.search).get('fixture') || 'forest';
const ROWS = FIXTURES[FIXTURE] || FIXTURES.forest;

const TERRAIN = {
  '~': 'deep_sea', c: 'coastal_sea', p: 'plains',
  F: 'forest_olive_grove', h: 'hills', m: 'mountain_limestone',
  M: 'mountain_red', s: 'scrub_maquis', d: 'semi_desert', '.': 'fog',
  r: 'river', v: 'river_valley', D: 'river_delta', C: 'forest_cedar',
};

// row/col -> axial. Enda stället som känner till offseten.
const ax = (col, row) => ({ q: col, r: row - Math.floor(col / 2) });

const tiles = [];
ROWS.forEach((line, row) => {
  [...line].forEach((ch, col) => {
    const { q, r } = ax(col, row);
    tiles.push({ q, r, terrain: TERRAIN[ch] });
  });
});

const tileAt = (col, row) => {
  const { q, r } = ax(col, row);
  return tiles.find(t => t.q === q && t.r === r);
};

// Deposits: koppar i kullen alltid, plus en som ligger PÅ terrängen under
// arbete — markören ritas av drawDepositIcons() och en ny marktextur under den
// är precis så cedar-markören en gång drunknade i lövverket.
// Fyndigheten måste sitta på en hex som terrängen faktiskt har.
// Reliefixturens fyndigheter följer mapgens sanning i stället för att spridas
// jämnt: tenn och silver sitter BARA på mountain_limestone, koppar bara på
// hills (mapgen.go §P1c). Det är precis den geografin spelaren ska kunna läsa
// ur höjdterrängen — och därför måste markörerna överleva den nya marken.
const DEPOSITS = {
  forest: [[6, 2, 'cedar_deposit']],
  plains: [[3, 2, 'tin_deposit'], [6, 4, 'cedar_deposit']],
  relief: [[4, 1, 'tin_deposit'], [5, 0, 'silver_deposit']],
  // Ingen extra fyndighet på torrmarken, och det är mapgens sanning och inte
  // en glömska: koppar sitter på hills, tenn och silver på mountain_limestone,
  // ceder på forest_olive_grove (mapgen.go steg 7). Varken scrub_maquis eller
  // semi_desert är kandidatterräng för någon av dem. Kopparn i (7,1) ligger på
  // en kullhex i den här fixturen — alltså sant placerad, och intill båda de
  // nya markerna där markören ska hålla.
  dry: [],
  // Cedern sitter på cederskogen — det är hela poängen med steg 7 i mapgen
  // efter 2026-07-29: terrängen ÄR fyndigheten. Markören måste därför överleva
  // den mörkaste marken på kartan, vilket är precis där den en gång drunknade
  // i lövverket.
  cedar: [[5, 3, 'cedar_deposit']],
  // Ingen fyndighet på floden: varken flod, dal eller delta är kandidatterräng
  // för någon fyndighet i mapgen. Kopparn i (7,1) ligger på en kullhex även
  // här och står alltså sant placerad intill källans höjd.
  river: [],
};
tileAt(7, 1).copper_deposit = true;
(DEPOSITS[FIXTURE] || []).forEach(([col, row, kind]) => { tileAt(col, row)[kind] = true; });

// Terrängvariationen hashas ur WORLD_ID. ?world=<sträng> byter värld utan att
// röra fixturen, så man kan kontrollera båda halvorna av kontraktet: samma
// värld ger identisk bild vid omladdning, olika världar ger olika skog.
State.WORLD_ID = new URLSearchParams(location.search).get('world')
  || 'showcase-forest-0000-0000-000000000000';
State.MY_PLAYER_ID = 'showcase-player';
State.tileData = tiles;

// Två egna städer på angränsande hexar -> drawRoad() ritar vägen mellan dem.
// Den ena står i skogen med flit: stadssiluetten måste läsa mot lövverk, inte
// bara mot slätt.
const city = (col, row, name, extra = {}) => Object.assign(
  ax(col, row),
  { name, own: true, culture: 'akhaier', walls: 2, size_tier: 3, state: 'active',
    army_total: 3, is_extra: false, is_outpost: false }, extra,
);
// Två egna städer i olika LED och olika murnivå: hela poängen med
// stadssiluetterna är att en palatsstad och en nygrundad koloni inte får se
// likadana ut, och det går bara att bedöma med båda i samma bild.
State.provinceData = [
  city(4, 4, 'Kydonia'),
  city(5, 4, 'Phaistos', { walls: 0, size_tier: 0, army_total: 0 }),
];

// Ruralprojektion: byggnaden på en catchment-hex (Fas A2-ytan), av den sort
// terrängen under arbete faktiskt bär — såg i lunden, gård på slätten.
const RURAL = {
  forest: [[4, 3, 'lumbermill']],
  plains: [[4, 3, 'farm'], [6, 3, 'lumbermill']],
  relief: [[3, 3, 'mine']],
  dry: [[4, 3, 'farm'], [7, 2, 'mine']],
};
State.ruralData = (RURAL[FIXTURE] || []).map(
  ([col, row, type]) => Object.assign(ax(col, row), { building_type: type }),
);

// Stående landenheter PÅ terrängen under arbete — måttstocken för hela
// skalfrågan. Ett träd som är större än en armé läser som diorama, inte som
// terräng, och det går bara att bedöma med enheten i samma bild som marken.
const UNITS = {
  forest: [[3, 6], [5, 2], [6, 5]],
  plains: [[3, 6], [6, 2], [7, 4]],
  // En aktör på VARDERA höjdterrängen: kalksten, röd bergrygg, kulle.
  // Kalkstenen är dessutom den ruta som redan är utpekad som enhetens värsta
  // (princip 21) — den ska stå i bilden, inte i en anteckning.
  relief: [[4, 2], [6, 2], [3, 4]],
  // En aktör på skruben, en på halvöknen, en på kullen mellan dem — de tre
  // rutor enhetsläsbarheten kan gå förlorad i när marken slutar vara platt.
  dry: [[3, 6], [7, 4], [6, 5]],
};
State.unitsData = (UNITS[FIXTURE] || []).map(
  ([col, row], i) => Object.assign(ax(col, row),
    { status: 'positioned', category: 'land', id: `u${i + 1}` }),
);

// Vald hex (samma tillstånd som ett klick ger).
State.selectedHex = ax(5, 5);

// ── Kamera ────────────────────────────────────────────────────────────────
// Zoom över LOCAL_ZOOM (0.55) så det lokala registret är på: catchment-tint
// och ruralprojektion syns, vilket är precis de lager en skogsändring riskerar
// att dränka.
// ?zoom= gör zoomen mätbar. Klippkantens kantutjämning ligger i LOGISKA pixlar
// och skalas därför med zoom × SCALE: en söm som är osynlig vid 1,6 kan vara
// bred vid 3,0. Terrängen måste hålla över hela spannet, inte bara vid ett läge.
State.camera.zoom = Number(new URLSearchParams(location.search).get('zoom')) || 1.6;
const mid = ax(4, 4);
const c = hexPx(mid.q, mid.r);
State.camera.x = canvas.width / 2 - c.x * State.camera.zoom * SCALE;
State.camera.y = canvas.height / 2 - c.y * State.camera.zoom * SCALE;

// ── Frysta frames ─────────────────────────────────────────────────────────
// render() ökar animFrame självt, så vi nollställer före varje ritning: samma
// anrop ger samma bild, körning efter körning.
window.SHOWCASE = {
  draw(frame = 100) {
    State.animFrame = frame - 1;
    State.lastSeaTick = -1;
    State.dirty = true;
    render();
  },
  // Var varje hex hamnade på skärmen, i CSS-pixlar relativt #map-root, plus
  // vilken terräng som ligger där. Finns för att `tools/terrainstats.py` ska
  // kunna mäta FÄRDIGRENDERAD yta per terräng utan att kopiera fixturen —
  // princip 17 kräver att hela luminanstabellen vägs om efter varje tonändring,
  // och nominella basfärger duger inte längre när terrängen bär egen textur:
  // det är den ritade ytans medelvärde och spridning som ögat läser.
  tiles() {
    return State.tileData.map(t => {
      const { x, y } = hexPx(t.q, t.r);
      // Canvasens backing store är lika stor som elementet i CSS-pixlar
      // (`canvas.width === 900` när #map-root är 900 px brett) — SCALE är
      // renderarens INTERNA ctx.scale, inte en upplösningsfaktor. Att dela med
      // SCALE här sköt varje provpunkt ur läge och gav mätvärden som såg ut som
      // en trasig palett; verktyget hade fel, inte koden.
      const k = State.camera.zoom * SCALE;
      return {
        terrain: t.terrain,
        sx: State.camera.x + x * k,
        sy: State.camera.y + y * k,
        rin: (22 * Math.sqrt(3) / 2) * k,   // hexens inradie på skärmen
      };
    });
  },
  ready: true,
};
window.SHOWCASE.draw();
</script>
</body>
</html>
