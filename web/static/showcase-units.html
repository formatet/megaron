<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Megaron — unit readability rig</title>
<!--
  Enhetsläsbarhetsrigg. Syskon till showcase-forest.html och byggd på samma
  frysta-frame-princip: requestAnimationFrame stubbas före modulimporten, så
  render() ritar exakt en deterministisk bild ur den RIKTIGA renderaren.

  Syftet är att göra enheten till det fasta måttet som terränggrafiken måste
  underordna sig — inte tvärtom. Samma aktör renderas över varje terräng den
  ska överleva, och terrängförbättringar godkänns bara om aktörerna håller i
  alla rutor.

  Sedan Fas 2 (megaron_aktorer_plan.md) visar riggen ALLA NIO aktörer, en per
  rad, mot varje terräng. Kontrollfrågan som ska gå att besvara utan tooltip:
  "är detta en trupp, ett skepp, en Host, en karavan eller en Runner?"

  Kör:  python3 -m http.server 8099 --directory web/
        http://localhost:8099/static/showcase-units.html
        ?zoom=1.4 (1.4 rymmer alla nio raderna; ?zoom=2.4 för närgranskning)
-->
<link rel="stylesheet" href="/static/megaron.css">
<style>
  body { margin: 0; background: #14100C; color: #E8DCC8;
         font: 13px/1.5 ui-monospace, monospace; padding: 12px; }
  #map-root { position: relative; width: 980px; height: 1010px; }
  #hex-canvas { display: block; width: 100%; height: 100%; }
  #tile-tooltip { position: absolute; display: none; }
  h1 { font-size: 15px; margin: 0 0 8px; color: #C8B48A; }
  p  { margin: 0 0 8px; color: #9C8F76; }
</style>
<script>
  window.requestAnimationFrame = function () { return 0; };
</script>
</head>
<body>
<h1>Aktörsläsbarhet — nio aktörer över varje terräng de måste överleva</h1>
<p>Rad uppifrån: Spearmen · Elite Infantry · War Chariot · Nomadic Host · Karavan ·
   Runner · Galley · War Galley · Emporos.
   Kolumn: slätt · olivlund · kullar · kust · berg · slätt(anfall) · dimma.</p>
<div id="map-root">
  <canvas id="hex-canvas"></canvas>
  <div id="tile-tooltip"></div>
</div>

<script type="module">
import { State } from '/static/js/megaron/state.js';
import { render, canvas, SCALE, hexPx } from '/static/js/megaron/render/map.js';

const params = new URLSearchParams(location.search);

// Kolumn = terräng aktören ska överleva mot. Kolumn 5 upprepar slätten med
// anfallsavsikt, så accentfärgen syns bredvid sin egen neutrala form.
const COLS = [
  { t: 'plains',             label: 'slätt' },
  { t: 'forest_olive_grove', label: 'olivlund' },
  { t: 'hills',              label: 'kullar' },
  { t: 'coastal_sea',        label: 'kust' },
  { t: 'mountain_limestone', label: 'berg' },
  { t: 'plains',             label: 'anfall',  intent: 'attack' },
  { t: 'fog',                label: 'dimma' },
];

// Rad = aktör. `naval` avgör om raden hör hemma på vatten; landaktörer på en
// sjöhex vore en lögn om terrängen, så sjökolumnen får skeppen och tvärtom.
const ROWS = [
  { type: 'spearman' },
  { type: 'elite_infantry' },
  { type: 'war_chariot' },
  { type: 'nomadic_host' },
  { actor: 'caravan' },
  { actor: 'runner' },
  { type: 'galley',      naval: true },
  { type: 'war_galley',  naval: true },
  { type: 'merchantman', naval: true },
];

const ax = (col, row) => ({ q: col, r: row - Math.floor(col / 2) });

const tiles = [];
COLS.forEach((c, col) => {
  for (let row = 0; row < ROWS.length; row++) {
    // En landaktör ska stå på land även i sjökolumnen och tvärtom — annars
    // mäter riggen fel sak (en gångare på vatten, ett skepp på berg).
    const sea = ROWS[row].naval;
    const terrain = sea ? 'coastal_sea' : (c.t === 'coastal_sea' ? 'plains' : c.t);
    tiles.push(Object.assign(ax(col, row), { terrain }));
  }
});

State.WORLD_ID = 'showcase-units-0000-0000-000000000000';
State.MY_PLAYER_ID = 'showcase-player';
State.tileData = tiles;
State.provinceData = [];
State.ruralData = [];
State.marchData = [];
State.messengerData = [];
State.tradeData = [];

// Enheter (units-lagret) — allt utom karavan och Runner, som har egna lager.
State.unitsData = [];
COLS.forEach((c, col) => {
  if (c.t === 'fog') return;
  ROWS.forEach((r, row) => {
    if (!r.type) return;
    const a = ax(col, row);
    if (c.intent) {
      // Anfallskolumnen: en marsch vars ankomst redan passerat klampas till
      // progress = 1 och ritas exakt på målhexen. Det är det enda sättet att få
      // in intent-färgade aktörer i en FRYST bild — annars interpoleras
      // positionen mot väggklockan och skärmdumpen blir icke-deterministisk.
      State.unitsData.push(Object.assign({}, a, {
        id: `m${col}-${row}`, type: r.type, status: 'marching',
        category: r.naval ? 'naval' : 'land',
        q: a.q, r: a.r, target_q: a.q, target_r: a.r,
        departs_at: '2020-01-01T00:00:00Z', arrives_at: '2020-01-02T00:00:00Z',
        march_intent: c.intent,
      }));
    } else {
      State.unitsData.push(Object.assign({}, a, {
        id: `u${col}-${row}`, type: r.type, status: 'positioned',
        category: r.naval ? 'naval' : 'land',
      }));
    }
  });
});

// Karavaner och Runners bor inte i units-tabellen och ritas ur egna lager.
const PAST = '2020-01-01T00:00:00Z', PAST_END = '2020-01-02T00:00:00Z';
COLS.forEach((c, col) => {
  if (c.t === 'fog') return;
  ROWS.forEach((r, row) => {
    if (!r.actor) return;
    const a = ax(col, row);
    const leg = { origin_q: a.q, origin_r: a.r, dest_q: a.q, dest_r: a.r,
                  target_q: a.q, target_r: a.r };
    if (r.actor === 'caravan') {
      State.tradeData.push(Object.assign(leg, {
        departs_at: PAST, arrives_at: PAST_END, sent_at: PAST,
      }));
    } else {
      State.messengerData.push(Object.assign(leg, {
        sent_at: PAST, arrives_at: PAST_END,
        own: true, kind: col === 5 ? 'order' : 'message',
      }));
    }
  });
});

// Markeringen finns bara i ETT exemplar i renderaren (State.selectedHex).
State.selectedHex = ax(0, 0);

State.camera.zoom = parseFloat(params.get('zoom') || '1.4');
const mid = ax(3, 4);
const c = hexPx(mid.q, mid.r);
State.camera.x = canvas.width / 2 - c.x * State.camera.zoom * SCALE;
State.camera.y = canvas.height / 2 - c.y * State.camera.zoom * SCALE;

window.SHOWCASE = {
  draw(frame = 100) {
    State.animFrame = frame - 1;
    State.lastSeaTick = -1;
    State.dirty = true;
    render();
  },
  ready: true,
};
window.SHOWCASE.draw();
</script>
</body>
</html>
